nt-weight="900" fill="#8B8B9C" text-anchor="middle">…</text><rect x="830" y="472" width="60" height="36" rx="10" fill="#FFF4EA" stroke="#E07B2E" stroke-width="1.4"/><text x="860" y="496" font-size="16" font-weight="850" fill="#A04E10" text-anchor="middle">v<tspan font-size="13" baseline-shift="sub">t</tspan></text><path d="M860 470 L860 452" stroke="#E07B2E" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a)"/><rect x="820" y="400" width="80" height="50" rx="12" fill="#E07B2E"/><text x="860" y="432" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">h<tspan font-size="13" baseline-shift="sub">t</tspan></text><path d="M372 425 L426 425" stroke="#E07B2E" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a)"/><path d="M512 425 L566 425" stroke="#E07B2E" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a)"/><path d="M652 425 L670 425" stroke="#E07B2E" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a)"/><path d="M808 425 L816 425" stroke="#E07B2E" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a)"/><text x="1048" y="400" font-size="15" font-weight="800" fill="#4A4A5C" text-anchor="start">점점 느려짐</text><text x="1048" y="420" font-size="15" font-weight="800" fill="#4A4A5C" text-anchor="start">멈춤 · 급감 추세</text><text x="1048" y="452" font-size="15" font-weight="700" fill="#8B8B9C" text-anchor="start">순서대로 기억해</text><text x="1048" y="472" font-size="15" font-weight="700" fill="#8B8B9C" text-anchor="start">변화를 판단</text><path d="M1228 120 L1262 120 L1262 268 L1290 268" stroke="#4B48E0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a)"/><path d="M1228 430 L1262 430 L1262 292 L1290 292" stroke="#E07B2E" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a)"/><rect x="1296" y="214" width="150" height="132" rx="20" fill="url(#a2g)"/><text x="1371" y="264" font-size="21" font-weight="900" fill="#FFFFFF" text-anchor="middle">종합 판정</text><text x="1371" y="292" font-size="15" font-weight="800" fill="#E5E4FF" text-anchor="middle">Softmax</text><text x="1371" y="318" font-size="13" font-weight="700" fill="#E5E4FF" text-anchor="middle">ESP32 온디바이스</text><path d="M1446 280 L1500 120" stroke="#C9C8F8" stroke-width="1.6"/><circle cx="1518" cy="120" r="20" fill="#2E9E6A"/><text x="1552" y="127" font-size="21" font-weight="900" fill="#1D1C2B" text-anchor="start">정상</text><path d="M1446 280 L1500 200" stroke="#C9C8F8" stroke-width="1.6"/><circle cx="1518" cy="200" r="20" fill="#AEB2FB"/><text x="1552" y="207" font-size="21" font-weight="900" fill="#1D1C2B" text-anchor="start">흔들림</text><path d="M1446 280 L1500 280" stroke="#C9C8F8" stroke-width="1.6"/><circle cx="1518" cy="280" r="20" fill="#7471F0"/><text x="1552" y="287" font-size="21" font-weight="900" fill="#1D1C2B" text-anchor="start">당겨짐</text><path d="M1446 280 L1500 360" stroke="#C9C8F8" stroke-width="1.6"/><circle cx="1518" cy="360" r="20" fill="#F0506E"/><text x="1552" y="367" font-size="21" font-weight="900" fill="#1D1C2B" text-anchor="start">줄 분리</text><path d="M1446 280 L1500 440" stroke="#C9C8F8" stroke-width="1.6"/><circle cx="1518" cy="440" r="20" fill="#E07B2E"/><text x="1552" y="447" font-size="21" font-weight="900" fill="#1D1C2B" text-anchor="start">소진</text><text x="1600" y="548" font-size="15" font-weight="800" fill="#8B8B9C" text-anchor="middle">판정 5종 · 식 (15)</text><rect x="0" y="584" width="1700" height="130" rx="16" fill="#F6F7F9" stroke="#DCDCE6" stroke-width="1.2"/><text x="24" y="626" font-size="13" font-weight="700" fill="#8B8B9C">(11)</text><text x="64" y="626" font-size="18" font-weight="600" fill="#1D1C2B">v<tspan font-size="13" baseline-shift="sub">n</tspan> = (W<tspan font-size="13" baseline-shift="sub">I</tspan> − W<tspan font-size="13" baseline-shift="sub">f</tspan>) / T,   r<tspan font-size="13" baseline-shift="sub">k</tspan> = (v<tspan font-size="13" baseline-shift="sub">k</tspan> − v<tspan font-size="13" baseline-shift="sub">n</tspan>) / v<tspan font-size="13" baseline-shift="sub">n</tspan></text><text x="64" y="646" font-size="13" font-weight="600" fill="#8B8B9C">정상 유속 기준 자가측정 · 상대 편차</text><text x="591" y="626" font-size="13" font-weight="700" fill="#8B8B9C">(12)</text><text x="631" y="626" font-size="18" font-weight="600" fill="#1D1C2B">s<tspan font-size="13" baseline-shift="sub">k</tspan> = −1 (r<tspan font-size="13" baseline-shift="sub">k</tspan> &lt; −τ),  +1 (r<tspan font-size="13" baseline-shift="sub">k</tspan> &gt; τ),  0 (그 외)</text><text x="631" y="646" font-size="13" font-weight="600" fill="#8B8B9C">허용 오차 τ로 3상태 부호화</text><text x="1157" y="626" font-size="13" font-weight="700" fill="#8B8B9C">(13)</text><text x="1197" y="626" font-size="18" font-weight="600" fill="#1D1C2B">X<tspan font-size="13" baseline-shift="sub">k</tspan> = reshape(s<tspan font-size="13" baseline-shift="sub">k−15:k</tspan>, 4×4)</text><text x="1197" y="646" font-size="13" font-weight="600" fill="#8B8B9C">연속 16상태 → 4×4 입력 (원소 −1 · 0 · +1)</text><text x="24" y="684" font-size="13" font-weight="700" fill="#8B8B9C">(14)</text><text x="64" y="684" font-size="18" font-weight="600" fill="#1D1C2B">h<tspan font-size="13" baseline-shift="sub">k</tspan> = tanh(W<tspan font-size="13" baseline-shift="sub">h</tspan>h<tspan font-size="13" baseline-shift="sub">k−1</tspan> + W<tspan font-size="13" baseline-shift="sub">v</tspan>v<tspan font-size="13" baseline-shift="sub">k</tspan> + b)</text><text x="64" y="704" font-size="13" font-weight="600" fill="#8B8B9C">RNN 은닉 상태</text><text x="874" y="684" font-size="13" font-weight="700" fill="#8B8B9C">(15)</text><text x="914" y="684" font-size="18" font-weight="600" fill="#1D1C2B">ŷ<tspan font-size="13" baseline-shift="sub">k</tspan> = argmax softmax(W<tspan font-size="13" baseline-shift="sub">o</tspan>[f<tspan font-size="13" baseline-shift="sub">C</tspan>(X<tspan font-size="13" baseline-shift="sub">k</tspan>); h<tspan font-size="13" baseline-shift="sub">k</tspan>] + b<tspan font-size="13" baseline-shift="sub">o</tspan>)</text><text x="914" y="704" font-size="13" font-weight="600" fill="#8B8B9C">CNN 특징 f_C와 결합 → 5종 판정</text></svg>