<svg class="r-tsvg cp-a2" viewBox="0 0 1700 716" role="img" aria-label="AI 분석 — 10장의 보정 하중 · 유속을 두 갈래로 분석합니다. CNN은 −1 · 0 · +1 상태 부호화와 4×4 패턴을 Conv2D 3×3 · 8, MaxPool 2×2, Dense 16으로 분석해 순간 흔들림(고립 칸)과 지속 이상(덩어리)을 구분하고, RNN은 유속 v1…vt를 순서대로 기억해 점점 느려짐 · 멈춤 · 급감 추세를 봅니다. 두 결과를 종합해 정상 · 흔들림 · 당겨짐 · 줄 분리 · 소진 5종으로 판정합니다."><defs><marker id="a2a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker><linearGradient id="a2g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7471F0"/><stop offset="1" stop-color="#4B48E0"/></linearGradient></defs><rect x="0" y="200" width="210" height="160" rx="20" fill="url(#a2g)"/><text x="20" y="236" font-size="15" font-weight="800" fill="#E5E4FF" text-anchor="start">10장 출력</text><text x="20" y="272" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="start">보정 하중 w(t)</text><text x="20" y="304" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="start">유속 v(t)</text><path d="M20.0 338.0 L22.4 339.0 L24.8 340.0 L27.2 340.9 L29.6 341.7 L32.0 342.4 L34.4 343.0 L36.8 343.5 L39.2 343.8 L41.6 344.0 L44.0 344.0 L46.4 343.8 L48.8 343.5 L51.2 343.0 L53.6 342.3 L56.0 341.6 L58.4 340.7 L60.8 339.8 L63.2 338.8 L65.6 337.8 L68.0 336.9 L70.4 335.9 L72.8 335.0 L75.2 334.2 L77.6 333.5 L80.0 332.9 L82.4 332.4 L84.8 332.1 L87.2 332.0 L89.6 332.0 L92.0 332.2 L94.4 332.6 L96.8 333.1 L99.2 333.8 L101.6 334.5 L104.0 335.4 L106.4 336.3 L108.8 337.3 L111.2 338.3 L113.6 339.3 L116.0 340.2 L118.4 341.1 L120.8 341.9 L123.2 342.6 L125.6 343.2 L128.0 343.6 L130.4 343.9 L132.8 344.0 L135.2 343.9 L137.6 343.7 L140.0 343.3 L142.4 342.8 L144.8 342.1 L147.2 341.3 L149.6 340.5 L152.0 339.5 L154.4 338.5 L156.8 337.5 L159.2 336.6 L161.6 335.6 L164.0 334.7 L166.4 333.9 L168.8 333.3 L171.2 332.7 L173.6 332.3 L176.0 332.1 L178.4 332.0 L180.8 332.1 L183.2 332.3 L185.6 332.7 L188.0 333.3 L190.4 334.0" stroke="#FFD84D" stroke-width="2.6" fill="none"/><path d="M214 260 L244 260 L244 120 L262 120" stroke="#4B48E0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a)"/><path d="M214 300 L244 300 L244 430 L262 430" stroke="#4B48E0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a)"/><rect x="266" y="16" width="960" height="208" rx="22" fill="#FFFFFF" stroke="#DCDCE6" stroke-width="1.6"/><rect x="286" y="32" width="74" height="28" rx="14" fill="#4B48E0"/><text x="323" y="52" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">CNN</text><text x="372" y="53" font-size="18" font-weight="850" fill="#1D1C2B" text-anchor="start">순간 패턴 = 모양으로 분석</text><rect x="286" y="80" width="190" height="120" rx="14" fill="#ECEBFE"/><text x="381" y="110" font-size="17" font-weight="850" fill="#4B48E0" text-anchor="middle">상태 부호화</text><rect x="298" y="128" width="52" height="56" rx="8" fill="#AEB2FB" stroke="#AEB2FB" stroke-width="1.2"/><text x="324" y="152" font-size="16" font-weight="900" fill="#1D1C2B" text-anchor="middle">−1</text><text x="324" y="174" font-size="13" font-weight="700" fill="#4A4A5C" text-anchor="middle">느림</text><rect x="356" y="128" width="52" height="56" rx="8" fill="#FFFFFF" stroke="#AEB2FB" stroke-width="1.2"/><text x="382" y="152" font-size="16" font-weight="900" fill="#1D1C2B" text-anchor="middle">0</text><text x="382" y="174" font-size="13" font-weight="700" fill="#4A4A5C" text-anchor="middle">정상</text><rect x="414" y="128" width="52" height="56" rx="8" fill="#4B48E0" stroke="#AEB2FB" stroke-width="1.2"/><text x="440" y="152" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">+1</text><text x="440" y="174" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">빠름</text><path d="M480 140 L512 140" stroke="#4B48E0" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2a)"/><rect x="518" y="80" width="26" height="26" rx="4" fill=